<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Prism — not authorized</title>
    <style>
      :root { --bg: #f7f7fb; --fg: #1b1b28; --muted: #5d5d73; --card: #ffffff; --line: #e3e3ee; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #111118; --fg: #ececf4; --muted: #a2a2b8; --card: #1a1a24; --line: #2c2c3a; }
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
             background: var(--bg); color: var(--fg);
             font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 420px; background: var(--card); border: 1px solid var(--line);
             border-radius: 14px; padding: 28px; }
      h1 { margin: 0 0 8px; font-size: 1.3rem; }
      p { margin: 0 0 16px; color: var(--muted); }
      a { color: inherit; font-weight: 600; }
      .bar { height: 4px; border-radius: 4px; margin-bottom: 20px;
             background: linear-gradient(90deg, #ff5e7e, #ffb648, #5fd38d, #49a6ff, #8b6bff); }
    </style>
  </head>
  <body>
    <main>
      <div class="bar"></div>
      <h1>This account can't use Prism</h1>
      <p>Prism is private. You're signed in with a Microsoft account that hasn't been invited.</p>
      <p><a href="/.auth/logout?post_logout_redirect_uri=/">Sign out</a> and sign in with the invited account.</p>
    </main>
  </body>
</html>
